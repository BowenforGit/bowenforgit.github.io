- title: "Gave a talk at ETH Zurich Systems Group lunch seminar"
  date: "2025-10-31"
  read_more: true
  content: "**Title**: DBs + GPUs: Where are we and what's next?\n\n **Abstract**: The massive parallelism and multi-TB/sec memory bandwidths offered by modern GPUs are hugely beneficial for accelerating SQL analytics queries. In this talk, I will start with a brief overview of the ongoing efforts in both research and industry to accelerate databases with GPUs. The main part of this talk will be about our two recent works on studying the performance of GPU-accelerated databases in a multi-GPU cluster set-up and single-GPU-CPU setup. I will mainly focus on the former, explaining how we build a distributed GPU-accelerated database with ML software stacks and gain massive performance improvement. Together with the latter work (MaxBench), we try to show the current performance landscape of GPU-based database systems and shed light on the key bottlenecks and promising directions for the next generation of GPU-accelerated data systems.\n\n [Slides](/lunchSeminar-BowenWu-2025-10-31.pdf)"
- title: "Gave a talk at Velox Tech Talk at Meta"
  date: "2025-09-26"
  read_more: true
  content: "**Title**: Prototyping a GPU-Accelerated Reader for the Nimble File Format with Velox Wave\n\n **Abstract**: Table scan is a costly operation in databases and data processing, often consuming significant CPU time. GPUs, with their parallelism and high-bandwidth memory, offer a promising way to accelerate table scans. In this talk, I will present our prototype of a GPU-accelerated reader for the Nimble file format using Velox Wave, a GPU-accelerated data processing library in Velox. Our prototype supports trivial, nullable, and chunked decoding as well as filter push-down."
